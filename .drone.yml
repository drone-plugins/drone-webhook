---
kind: pipeline
type: vm
name: windows-1809
platform:
  os: windows
  arch: amd64
pool:
  use: windows

steps:
  - name: environment
    image: golang:1.20
    pull: always
    environment:
      CGO_ENABLED: "0"
    commands:
      - . ./scripts/setup-go-windows.ps1
      - go version
      - go env
  - name: build
    image: golang:1.20
    environment:
      CGO_ENABLED: "0"
    commands:
      - . ./scripts/setup-go-windows.ps1
      - go build -v -ldflags "-X main.version=" -a -tags netgo -o release/windows/amd64/drone-webhook.exe .
  - name: docker
    image: plugins/docker
    settings:
      dockerfile: docker/Dockerfile.windows.1809
      repo: plugins/webhook
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      auto_tag: true
      auto_tag_suffix: windows-1809-amd64
      daemon_off: true
      purge: false
    when:
      ref:
        - refs/heads/master
        - refs/tags/**
depends_on:
  - testing
trigger:
  ref:
    - refs/heads/master
    - refs/tags/**
    - refs/pull/**

